<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile - BlueHorizon</title>
  <style>
    body {
      margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #a1c4fd, #c2e9fb);
      color: #04396c;
    }
    header {
      background: #1e3c72;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      position: relative;
    }
    .logo {
      color: #a8e063;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 1.2px;
      cursor: default;
    }
    nav a {
      color: #c2e9fb;
      margin: 0 15px;
      font-weight: 600;
      text-decoration: none;
      font-size: 16px;
      transition: color 0.3s;
    }
    nav a:hover {
      color: #a8e063;
      text-decoration: underline;
    }
    .profile-icon {
      position: fixed;
      top: 24px;
      right: 32px;
      z-index: 1000;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #c2e9fb;
      border: 2px solid #a8e063;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(30,60,114,0.15);
      cursor: pointer;
      overflow: hidden;
    }
    .profile-icon img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
    }
    main {
      padding: 60px 40px;
      max-width: 600px;
      margin: 40px auto;
      background: #f0fff0;
      border-radius: 18px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.13);
      text-align: center;
    }
    .profile-details {
      margin-top: 30px;
    }
    .profile-avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #c2e9fb;
      border: 3px solid #a8e063;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(30,60,114,0.13);
    }
    .profile-avatar img {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      object-fit: cover;
    }
    .profile-name {
      font-size: 2rem;
      font-weight: 700;
      color: #1e3c72;
      margin-bottom: 8px;
    }
    .profile-surname {
      font-size: 1.3rem;
      color: #165a17;
      margin-bottom: 12px;
    }
    .profile-info {
      font-size: 1.1rem;
      color: #1c3a62;
      margin-bottom: 18px;
    }
    @media(max-width: 650px) {
      main {
        padding: 30px 10px;
      }
      .profile-avatar {
        width: 80px; height: 80px;
      }
      .profile-avatar img {
        width: 76px; height: 76px;
      }
    }
  </style>
</head>
<body>

<header style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#1e3c72;padding:20px 30px;">
  <a href="index.html" class="logo" style="display:flex;align-items:center;gap:10px;text-decoration:none;">
    <img src="https://cdn-icons-png.flaticon.com/512/201/201623.png" alt="BlueHorizon Logo" style="width:36px;height:36px;vertical-align:middle;border-radius:8px;" />
    <span style="color:#a8e063;font-size:30px;font-weight:900;letter-spacing:1.2px;">BlueHorizon</span>
  </a>
  <div style="flex:1;display:flex;justify-content:center;">
    <nav style="display:flex;align-items:center;gap:10px;">
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('places') }}">Places</a>
      <a href="{{ url_for('reviews') }}">Reviews ⭐</a>
      <a href="{{ url_for('todo') }}">What To Do 🎯</a>
      <a href="{{ url_for('signup') }}">Sign Up 📝</a>
      <a href="{{ url_for('login') }}">Log In 🔐</a>
      <a href="{{ url_for('profile') }}" style="display:block;width:40px;height:40px;"><img src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png" alt="Profile" style="width:36px;height:36px;border-radius:50%;object-fit:cover;" /></a>
    </nav>
  </div>
  <div class="search-bar">
    <form action="{{ url_for('search') }}" method="get" style="display:inline;">
      <input type="text" name="q" placeholder="Search destinations..." required style="padding:7px 15px;border-radius:25px;border:none;width:220px;font-size:14px;outline:none;transition:box-shadow 0.3s;">
      <button type="submit" style="display:none;">Search</button>
    </form>
  </div>
</header>

<main>
  <form method="post" action="{{ url_for('profile') }}" enctype="multipart/form-data" style="display: flex; flex-direction: column; align-items: center;">
    <div class="profile-avatar">
      <label for="avatar-upload" style="cursor:pointer;">
        <img src="{{ user['avatar_url'] if user['avatar_url'] else 'https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png' }}" alt="Profile Avatar" />
        <input id="avatar-upload" name="avatar" type="file" accept="image/*" style="display:none;" />
      </label>
    </div>
    <div class="profile-details">
      <div class="profile-name"><input type="text" name="name" value="{{ user['name'] or '' }}" placeholder="First Name" style="font-size:1.5rem;font-weight:700;color:#1e3c72;text-align:center;border:none;background:transparent;outline:none;"></div>
      <div class="profile-surname"><input type="text" name="surname" value="{{ user['surname'] or '' }}" placeholder="Last Name" style="font-size:1.1rem;color:#165a17;text-align:center;border:none;background:transparent;outline:none;"></div>
      <div class="profile-info">
        <strong>Email:</strong> {{ user['email'] }}<br/>
        <strong>Bio:</strong> <textarea name="bio" style="width:90%;border-radius:8px;border:1px solid #a1c4fd;padding:8px;">{{ user['bio'] or '' }}</textarea>
      </div>
      <button type="submit" style="margin:18px 0 0 0;padding:10px 28px;font-size:1.1rem;background:#1e3c72;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:700;box-shadow:0 2px 8px rgba(30,60,114,0.13);transition:background 0.2s;">Save Changes</button>
    </div>
  </form>
  <div style="display:flex;justify-content:center;gap:18px;margin-top:32px;">
    <a href="mailto:{{ user['email'] }}" style="background:#a8e063;color:#1e3c72;padding:10px 22px;border-radius:8px;font-weight:700;text-decoration:none;box-shadow:0 2px 8px rgba(30,60,114,0.13);transition:background 0.2s;">Email</a>
    <a href="{{ url_for('logout') }}" style="background:#e57373;color:#fff;padding:10px 22px;border-radius:8px;font-weight:700;text-decoration:none;box-shadow:0 2px 8px rgba(30,60,114,0.13);transition:background 0.2s;">Log Out</a>
  </div>
</main>

<footer style="background: #1e3c72; color: #a8e063; padding: 20px 0; text-align: center; font-weight: 600; font-size: 14px; margin-top: 60px;">
  Contact us: travel@bluehorizon.com | +599 91 70 22 | <tbilisi class="georgia"></tbilisi>
</footer>

<div style="position: fixed; bottom: 20px; left: 20px; text-align: center; z-index: 1000;">
  <a href="https://www.tbcbank.ge/" target="_blank" rel="noopener">
    <img 
      src="https://e7.pngegg.com/pngimages/911/456/png-clipart-computer-icons-business-others-blue-angle.png" 
      alt="TBC Logo" 
      style="width: 48px; height: auto; display: block; margin: 0 auto; 
             filter: grayscale(100%) brightness(1.2) contrast(1.2) sepia(1) hue-rotate(180deg) saturate(4);">
  </a>
  <span style="color: #1a237e; font-size: 16px; font-family: Arial, sans-serif;">TBC Logo</span>
</div>

</body>
</html>
